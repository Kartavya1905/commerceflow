# CommerceFlow local infrastructure (Milestone 2).
#
# Start it with scripts/dev-up.sh (or scripts/dev-up.ps1), which creates .env, checks ports and
# waits for health. Services without a profile are the core stack and always start;
# `--profile obs` adds observability; `--profile apps` adds the services.
#
# Every published port binds to 127.0.0.1 only, so nothing is reachable from your network.
# Image tags are pinned; bump them deliberately and record why in the PR.

name: commerceflow

x-restart: &restart
  restart: unless-stopped

services:
  # --- Core: data stores and messaging -------------------------------------------------------

  postgres:
    <<: *restart
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      # initdb's default trusts TCP connections from 127.0.0.1 inside the container; require
      # SCRAM passwords for every TCP connection instead. Applies when the volume is created.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h forces TCP: during first-time init the server listens on a socket only, so this
      # stays unhealthy until the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1g

  # Creates one database and one least-privilege login role per service. Runs on every
  # dev-up and is idempotent, so changing a password in .env takes effect without wiping data.
  postgres-init:
    image: postgres:18.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:?set in .env}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set in .env}
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD:?set in .env}
    volumes:
      - ./postgres/create-service-databases.sh:/usr/local/bin/create-service-databases.sh:ro
    entrypoint: ["sh", "/usr/local/bin/create-service-databases.sh"]
    restart: "no"

  kafka:
    <<: *restart
    image: apache/kafka:4.3.2
    environment:
      # Single node acting as broker and KRaft controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is for containers (kafka:29092), EXTERNAL for processes on your machine
      # (localhost:9092), e.g. a service started from the IDE.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics come only from contracts/.../topics.json; a typo must fail, not create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1g

  # Creates or reconciles topics and their dead-letter topics from the contract catalogue.
  kafka-init:
    build: ./kafka-init
    image: commerceflow/kafka-init:local
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC_CATALOG: /config/topics.json
    volumes:
      - ../../contracts/src/main/resources/events/topics.json:/config/topics.json:ro
    # The Kafka base image ships a broker health check; it means nothing for a one-shot job.
    healthcheck:
      disable: true
    restart: "no"

  redis:
    <<: *restart
    image: redis:8.10.3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
    # The password goes into a config file rather than the command line, so `ps` cannot see it.
    # volatile-lru evicts only keys with a TTL (cache, rate-limit buckets, carts) under pressure.
    command:
      - sh
      - -c
      - |
        printf 'requirepass %s\nappendonly yes\nmaxmemory 256mb\nmaxmemory-policy volatile-lru\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.33.0
    environment:
      MP_MAX_MESSAGES: 2000
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 128m

  # --- Services (profile: apps) --------------------------------------------------------------
  # scripts/dev-up.sh --apps builds the jars before starting these.

  identity-service:
    <<: *restart
    profiles: [apps]
    build: &service-build
      context: ../..
      dockerfile: deploy/docker/spring-boot-service.Dockerfile
      args:
        SERVICE: identity-service
    image: commerceflow/identity-service:local
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set in .env}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    secrets:
      - jwt_private_key
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck: &service-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT:-8081}/actuator/health/readiness > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 768m

  catalog-service:
    <<: *restart
    profiles: [apps]
    build:
      <<: *service-build
      args:
        SERVICE: catalog-service
    image: commerceflow/catalog-service:local
    environment:
      PORT: 8082
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set in .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *service-health
    mem_limit: 768m

  order-service:
    <<: *restart
    profiles: [apps]
    build:
      <<: *service-build
      args:
        SERVICE: order-service
    image: commerceflow/order-service:local
    environment:
      PORT: 8083
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_db
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      CATALOG_URI: http://catalog-service:8082
      JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *service-health
    mem_limit: 768m

  inventory-service:
    <<: *restart
    profiles: [apps]
    build:
      <<: *service-build
      args:
        SERVICE: inventory-service
    image: commerceflow/inventory-service:local
    environment:
      PORT: 8084
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
      KAFKA_BOOTSTRAP: kafka:29092
      JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *service-health
    mem_limit: 768m

  # The card provider stand-in, with its own database: what it charged survives anything
  # payment-service does, as with a real provider. Reachable only inside the network.
  payment-sandbox:
    <<: *restart
    profiles: [apps]
    build:
      <<: *service-build
      args:
        SERVICE: payment-sandbox
    image: commerceflow/payment-sandbox:local
    environment:
      PORT: 8099
      SANDBOX_DB_URL: jdbc:postgresql://postgres:5432/sandbox_db
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD:?set in .env}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:?set in .env}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck: *service-health
    mem_limit: 512m

  payment-service:
    <<: *restart
    profiles: [apps]
    build:
      <<: *service-build
      args:
        SERVICE: payment-service
    image: commerceflow/payment-service:local
    environment:
      PORT: 8085
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set in .env}
      KAFKA_BOOTSTRAP: kafka:29092
      PAYMENT_PROVIDER_URI: http://payment-sandbox:8099
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:?set in .env}
      JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      payment-sandbox:
        condition: service_healthy
    healthcheck: *service-health
    mem_limit: 768m

  api-gateway:
    <<: *restart
    profiles: [apps]
    build:
      <<: *service-build
      args:
        SERVICE: api-gateway
    image: commerceflow/api-gateway:local
    environment:
      IDENTITY_URI: http://identity-service:8081
      CATALOG_URI: http://catalog-service:8082
      ORDER_URI: http://order-service:8083
      INVENTORY_URI: http://inventory-service:8084
      PAYMENT_URI: http://payment-service:8085
      JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    # Only the public port. The management port (8090) stays inside the network for Prometheus.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health/readiness > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 768m

  # --- Observability (profile: obs) ----------------------------------------------------------

  otel-collector:
    <<: *restart
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki
      - prometheus
    mem_limit: 512m

  prometheus:
    <<: *restart
    profiles: [obs]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-remote-write-receiver   # Tempo writes service-graph metrics here
      - --web.enable-otlp-receiver           # the collector forwards OTLP metrics here
      - --web.enable-lifecycle               # dev-up reloads edited config (port is localhost-only)
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 512m

  tempo:
    <<: *restart
    profiles: [obs]
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    mem_limit: 512m

  loki:
    <<: *restart
    profiles: [obs]
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
    mem_limit: 512m

  kafka-exporter:
    <<: *restart
    profiles: [obs]
    image: danielqsj/kafka-exporter:v1.11.0
    command: ["--kafka.server=kafka:29092", "--log.level=warn"]
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 128m

  grafana:
    <<: *restart
    profiles: [obs]
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 512m

secrets:
  # Generated by scripts/dev-up.sh into the git-ignored secrets/ folder.
  jwt_private_key:
    file: ../../secrets/jwt-private.pem

volumes:
  pgdata:
  kafkadata:
  redisdata:
  promdata:
  grafanadata:
