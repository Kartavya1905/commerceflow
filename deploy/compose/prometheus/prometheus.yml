global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # The services, found by DNS. When the apps profile is not running the names do not resolve,
  # so these jobs simply have no targets instead of showing as down.
  - job_name: services
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [identity-service]
        type: A
        port: 8081
        refresh_interval: 10s
      - names: [catalog-service]
        type: A
        port: 8082
        refresh_interval: 10s
      - names: [api-gateway]
        type: A
        port: 8090
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
