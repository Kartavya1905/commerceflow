# Redis: carts, the catalogue cache and rate-limit buckets, as on Compose. The password goes into a
# config file in /tmp rather than onto the command line, so the process list does not show it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.10.3
          command:
            - sh
            - -c
            - |
              printf 'requirepass %s\nappendonly yes\nmaxmemory 256mb\nmaxmemory-policy volatile-lru\n' "$REDIS_PASSWORD" > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: commerceflow-secrets, key: REDIS_PASSWORD }
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: { name: commerceflow-secrets, key: REDIS_PASSWORD }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            exec:
              command: [sh, -c, 'redis-cli ping | grep -q PONG']
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
