# The two public entry points as NodePorts on the instance: the same ports as kind, so the security
# group's two rules match. externalTrafficPolicy Local keeps the caller's address, which the
# gateway's rate limits key on.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: commerceflow
spec:
  type: NodePort
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: commerceflow
spec:
  type: NodePort
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
