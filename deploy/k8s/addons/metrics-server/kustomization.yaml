# metrics-server: the CPU and memory numbers the HorizontalPodAutoscaler and `kubectl top` read.
# The upstream release manifest, pinned to a version, plus a kind-specific change and a pod-level
# security context.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
patches:
  # kind's kubelets serve self-signed certificates that metrics-server cannot verify. Acceptable on
  # a local, single-node cluster only; a real cluster has kubelet certificates signed by its CA.
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
  # The upstream container is already non-root with nothing to escalate; say so for the whole pod
  # too, as every CommerceFlow pod does (Trivy KSV-0118).
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
