# identity-service: accounts, sign-in, and the token signing key. Every Spring Boot service here
# follows the same shape (ADR-0015):
# - probes: startup and liveness ask /actuator/health/liveness (the process only); readiness asks
#   /actuator/health/readiness (the pod's own database, never Kafka or another service);
# - memory request = limit, so the pod is never killed for using memory it was scheduled with, and
#   the JVM sizes its heap from that limit (MaxRAMPercentage=75 in the image). CPU has a request
#   but no limit: a CPU limit throttles the JVM's start and its garbage collector;
# - a non-root user, a read-only root filesystem with /tmp on an emptyDir, no capabilities, no
#   service account token and no service-link variables (they would set REDIS_PORT=tcp://...);
# - preStop waits 5 s, so Services stop routing to the pod before it stops accepting requests,
#   then Spring drains for up to 30 s, inside the 40 s grace period.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app.kubernetes.io/name: identity-service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
        app.kubernetes.io/part-of: commerceflow
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-service
          image: commerceflow/identity-service:set-by-kind-up
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: endpoints, key: POSTGRES_HOST }
            - name: IDENTITY_DB_URL
              value: jdbc:postgresql://$(POSTGRES_HOST):5432/identity_db
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: commerceflow-secrets, key: IDENTITY_DB_PASSWORD }
            - name: JWT_PRIVATE_KEY_PATH
              value: /run/secrets/jwt/jwt-private.pem
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: commerceflow-secrets, key: BOOTSTRAP_ADMIN_EMAIL }
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: commerceflow-secrets, key: BOOTSTRAP_ADMIN_PASSWORD }
            - name: TRACING_EXPORT
              valueFrom:
                configMapKeyRef: { name: endpoints, key: TRACING_EXPORT }
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jwt-key
              mountPath: /run/secrets/jwt
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: jwt-key
          secret:
            secretName: jwt-private-key
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
# At most one pod down at a time for a voluntary disruption (a node drain). With one replica that
# does not block the drain; with two it keeps one serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
