# inventory-service: stock and reservations.
# Same shape as every Spring Boot service; identity-service.yaml explains each setting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/part-of: commerceflow
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-service
          image: commerceflow/inventory-service:set-by-kind-up
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: PORT
              value: "8084"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: endpoints, key: POSTGRES_HOST }
            - name: INVENTORY_DB_URL
              value: jdbc:postgresql://$(POSTGRES_HOST):5432/inventory_db
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: commerceflow-secrets, key: INVENTORY_DB_PASSWORD }
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef: { name: endpoints, key: KAFKA_BOOTSTRAP }
            - name: JWK_SET_URI
              value: http://identity-service:8081/.well-known/jwks.json
            - name: TRACING_EXPORT
              valueFrom:
                configMapKeyRef: { name: endpoints, key: TRACING_EXPORT }
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
