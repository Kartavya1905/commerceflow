# The web app: static files, and /api proxied to the gateway so the browser sees one origin (the
# refresh-token cookie is SameSite=Strict, and no CORS is needed). Runs as an unprivileged user.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Compose's DNS, re-asked every 10 s, so a recreated gateway container is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
      set $gateway http://api-gateway:8080;
      proxy_pass $gateway;
      proxy_http_version 1.1;
      # The browser's own Host, port included: the gateway compares it with Origin, and a
      # mismatch (localhost vs localhost:8000) would look like a cross-origin call and get 403.
      proxy_set_header Host $http_host;
      # The gateway believes this from nginx only (commerceflow.gateway.trusted-proxies): the
      # right-most entry, which nginx appends, is the client address its rate limits use.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      include /etc/nginx/security-headers.conf;
    }

    # Hashed file names: safe to cache for ever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
    }

    # Every other path is a client-side route: serve the app, never cached, so a deploy shows.
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
    }
  }
}
