name: security

on:
  push:
    branches: [main]
  pull_request:
  # New vulnerabilities are published every day; a weekly scan finds them without a code change.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history: a secret removed later is still in it
      - name: gitleaks
        run: bash scripts/scan-security.sh secrets

  dependencies-and-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (dependencies, Dockerfile and Compose misconfiguration, secrets)
        run: bash scripts/scan-security.sh fs

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build
        if: matrix.build-mode == 'manual'
        run: ./mvnw -B -ntp -DskipTests -Dspotless.check.skip=true package
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
