name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Formatting (spotless:check in validate), compile, unit tests (Surefire), then integration
      # tests (Failsafe) against PostgreSQL and Redis in Testcontainers.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: >-
          shellcheck -x -S warning
          scripts/*.sh scripts/lib/*.sh
          deploy/compose/kafka-init/create-topics.sh
          deploy/compose/postgres/create-service-databases.sh

  # Brings up the whole local stack on the runner and runs every infrastructure check.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: shell-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate compose file
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env.example --profile obs --profile apps config -q

      - name: Start infrastructure, observability and services
        run: bash scripts/dev-up.sh --obs --apps

      - name: Check infrastructure
        run: bash scripts/check-infra.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile obs --profile apps logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: bash scripts/dev-down.sh --volumes --yes
