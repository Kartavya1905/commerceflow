name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Formatting (spotless:check in validate), compile, unit tests (Surefire), then integration
      # tests (Failsafe) against PostgreSQL and Redis in Testcontainers.
      - name: Build and test
        run: ./mvnw -B -ntp verify 2>&1 | tee build.log

      # Logs and artifacts need a GitHub login to read; annotations do not. Publishing the Maven
      # error lines as annotations makes a failure diagnosable from the public run page and API.
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E '^\[ERROR\]' build.log \
            | grep -vE '^\[ERROR\] *$|Re-run Maven|For more information|\[Help 1\]|^\[ERROR\] -> |resume the build' \
            | head -10 \
            | while IFS= read -r line; do echo "::error title=build::${line:0:900}"; done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            build.log
          retention-days: 7

  # The web app, in the same pinned Node image used locally (no Node on the runner needed).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate the API types, then type-check, lint, test and build
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo/frontend node:22.23.4-alpine3.24 sh -c
          'npm ci --no-audit --no-fund
          && npm run generate
          && npm run typecheck && npm run lint && npm test && npm run build'
      # The client is generated from contracts/: a contract change without regenerating fails here.
      - name: Generated API types match the contracts
        run: git diff --exit-code -- frontend/src/api/schema

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: >-
          shellcheck -x -S warning
          scripts/*.sh scripts/lib/*.sh
          deploy/compose/kafka-init/create-topics.sh
          deploy/compose/postgres/create-service-databases.sh
      # Every alert links a runbook section that exists, and fires and clears in promtool's tests.
      - name: Alert rules
        run: bash scripts/check-alerts.sh
      # The Kubernetes manifests: valid against the API schema, and free of the M10 gate defects
      # (latest tags, committed Secrets, missing limits, probes or disruption budgets).
      - name: Kubernetes manifests
        run: bash scripts/check-k8s.sh

  # Brings up the whole local stack on the runner and runs every infrastructure check.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: shell-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate compose file
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env.example --profile obs --profile apps config -q

      - name: Start infrastructure, observability and services
        run: |
          set -o pipefail
          bash scripts/dev-up.sh --obs --apps 2>&1 | tee "$RUNNER_TEMP/dev-up.log"

      - name: Check infrastructure
        run: bash scripts/check-infra.sh

      # ROADMAP M8 acceptance: register, buy, see CONFIRMED, and admin refused, in a real browser.
      - name: Web app smoke test
        run: bash scripts/e2e.sh

      - name: Security suite against the stack
        run: bash scripts/security-test.sh

      # The images just built and run: no HIGH or CRITICAL vulnerability with a fix left untriaged.
      - name: Image scan (Trivy)
        run: bash scripts/scan-security.sh images

      - name: Smoke test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # Annotations are readable on the run page and through the API without opening the log.
      - name: Unhealthy containers as annotations
        if: failure()
        run: bash scripts/ci-report-unhealthy.sh "$RUNNER_TEMP/dev-up.log"

      - name: Container logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile obs --profile apps logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: bash scripts/dev-down.sh --volumes --yes

  # The same system on Kubernetes (kind): deployed by kind-up, then the smoke test, pods failing
  # mid-checkout, and a bad release rolled back. The HPA experiment runs locally only: it takes ten
  # minutes and its timing depends on the machine (docs/reports/hpa-experiment.md).
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: shell-lint
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install kind (pinned, checksum verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind version

      - name: Deploy to kind
        run: |
          set -o pipefail
          bash scripts/kind-up.sh 2>&1 | tee "$RUNNER_TEMP/kind-up.log"

      - name: Web app smoke test against kind
        run: E2E_BASE_URL=http://localhost:18000 bash scripts/e2e.sh

      - name: Checkouts while pods hang and are deleted
        run: bash scripts/kind-chaos.sh

      - name: Bad release and rollback
        run: bash scripts/kind-rollback.sh

      # Annotations are readable on the run page and through the API without opening the log.
      - name: Failing pods as annotations
        if: failure()
        run: bash scripts/ci-report-kind.sh "$RUNNER_TEMP/kind-up.log"

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-commerceflow -n commerceflow get pods -o wide || true
          kubectl --context kind-commerceflow -n commerceflow get events --sort-by=.lastTimestamp | tail -60 || true

      - name: Tear down
        if: always()
        run: bash scripts/kind-down.sh

  # The Terraform, without an AWS account: fmt, validate, tests against mocked providers, tflint,
  # checkov and the M11 gate (scripts/check-terraform.sh). Nothing is created; nothing costs money.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: shell-lint
    steps:
      - uses: actions/checkout@v7
      - name: Terraform checks
        env:
          # tflint's plugin download, clear of GitHub's anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-terraform.sh

  # The AWS demo's deploy path, without AWS: k3s (the release the instance installs) in Docker,
  # the images under their GHCR names, then the instance's own scripts/k3s-up.sh, and the smoke test.
  k3s:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: shell-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Deploy to k3s through the demo's path
        run: |
          set -o pipefail
          bash scripts/k3s-test.sh 2>&1 | tee "$RUNNER_TEMP/k3s-test.log"

      - name: Web app smoke test against k3s
        run: E2E_BASE_URL=http://localhost:28000 bash scripts/e2e.sh

      - name: Cluster state on failure
        if: failure()
        env:
          KUBECONFIG: deploy/k8s/.generated/k3s-kubeconfig
        run: |
          tail -n 30 "$RUNNER_TEMP/k3s-test.log" || true
          kubectl -n commerceflow get pods -o wide || true
          kubectl -n commerceflow get events --sort-by=.lastTimestamp | tail -40 || true

      - name: Tear down
        if: always()
        run: bash scripts/k3s-test.sh --down
