openapi: 3.1.0
info:
  title: CommerceFlow payment-service
  version: 0.1.0
  description: Admin views of payment attempts and manual reconciliation. Payments themselves are driven by Kafka commands.
servers:
  - url: http://localhost:8080
    description: Through the API gateway
security:
  - bearerAuth: []
paths:
  /api/v1/admin/payments:
    get:
      operationId: adminListPayments
      summary: Payment attempts, filterable by order or status (admin)
      x-required-role: ADMIN
      parameters:
        - name: orderId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
      responses:
        '200':
          description: Matching attempts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/payments/{attemptId}:
    get:
      operationId: adminGetPayment
      summary: One payment attempt (admin)
      x-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/payments/{attemptId}/reconcile:
    post:
      operationId: adminReconcilePayment
      summary: Ask the reconciler to check this attempt now instead of waiting for its schedule (admin)
      x-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '202': { description: Scheduled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The attempt is already in a final state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    PaymentStatus:
      type: string
      enum: [INITIATED, SUCCEEDED, FAILED, UNKNOWN, CANCELLED, REFUND_PENDING, REFUNDED]
    PaymentAttempt:
      type: object
      description: Contains no card data. paymentTokenRef is the opaque sandbox token id.
      required: [id, orderId, amountMinor, currency, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amountMinor: { type: integer }
        currency: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        paymentTokenRef: { type: string }
        providerChargeId: { type: string }
        failureCode: { type: string }
        reconcileAttempts: { type: integer }
        nextReconcileAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Problem:
      type: object
      description: RFC 9457 problem details. Never contains stack traces, SQL, or secrets.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such payment attempt
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
