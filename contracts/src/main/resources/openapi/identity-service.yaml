openapi: 3.1.0
info:
  title: CommerceFlow identity-service
  version: 0.1.0
  description: Registration, login, token refresh and JWKS. Access tokens are RS256 JWTs valid for 15 minutes.
servers:
  - url: http://localhost:8080
    description: Through the API gateway
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create a customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Exchange email and password for tokens
      description: >-
        Wrong email and wrong password return the same 401 body, so the response does not reveal
        whether an account exists. Repeated failures lock the account temporarily; a locked
        account also gets the same 401.
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenDelivery'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. The refresh token is also set as an HttpOnly cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token and issue a new access token
      description: >-
        Reads the refresh token from the cf_refresh cookie, or from the body for non-browser
        clients. Reusing an already-rotated refresh token revokes every token in its family.
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenDelivery'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh-token family
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: The authenticated user's profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: Public keys for verifying access tokens
      security: []
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TokenDelivery:
      name: X-Token-Delivery
      in: header
      required: false
      description: >-
        Browsers get the refresh token only as an HttpOnly, Secure, SameSite=Strict cookie (path
        /api/v1/auth), out of reach of page scripts. Non-browser clients send "body" to also
        receive it as refreshToken in the response.
      schema: { type: string, enum: [body] }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 to 128 characters, must not contain the email name, and needs at least 4 different characters. Never logged.
        displayName: { type: string, minLength: 1, maxLength: 100 }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    RefreshRequest:
      type: object
      additionalProperties: false
      description: Optional. Browsers send the refresh token as a cookie instead.
      properties:
        refreshToken: { type: string, maxLength: 512 }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Seconds until the access token expires }
        refreshToken: { type: string, description: Returned only to non-browser clients }
    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [CUSTOMER, ADMIN] }
    Problem:
      type: object
      description: RFC 9457 problem details. Never contains stack traces, SQL, or secrets.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The resource already exists or was modified concurrently
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: >-
        Rate limit exceeded at the API gateway. No body; Retry-After and X-RateLimit-* headers
        say when to retry.
      headers:
        Retry-After:
          schema: { type: integer }
