spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USER:payment_svc}
    password: ${PAYMENT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      # Milliseconds: Hikari binds this straight to a long.
      connection-timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      # Offsets are committed only after the handler returns (ack-mode record).
      enable-auto-commit: false
      isolation-level: read-committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # A handler can wait on the provider (read timeout) and a refund retry; stay well inside.
        max.poll.interval.ms: 120000
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    listener:
      # Continues the trace from the traceparent each event carries (TraceHeaders).
      observation-enabled: true
      ack-mode: record
      concurrency: 3
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8085}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  # One trace per checkout across every service and Kafka (NFR-08). Every request is sampled: this
  # is a local, low-traffic system. Spans leave only when TRACING_EXPORT is on (dev-up --obs), so
  # without the collector nothing retries an export endpoint that is not there.
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: ${TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Logs stay on stdout (JSON, with trace and correlation ids); only traces go out over OTLP.
  logging:
    export:
      otlp:
        enabled: false
  # Metrics are scraped by Prometheus (/actuator/prometheus); the starter's OTLP push would only
  # retry a collector endpoint every minute and log a warning each time.
  otlp:
    metrics:
      export:
        enabled: false
  # Latency as a histogram with fixed buckets, so dashboards show percentiles (p95, p99), not
  # averages. Nine buckets per route instead of the default ~70 keeps the series count low, and
  # 300 ms (NFR-05, alert SlowReads) is one of the bucket edges, so it is measured exactly.
  metrics:
    distribution:
      slo:
        http.server.requests: 25ms,50ms,100ms,200ms,300ms,500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Readiness covers only what this pod needs to serve: its own database. Kafka is left out on
      # purpose, so a broker blip cannot take every pod out of service at once; the outbox holds
      # events until it is back. Liveness covers the process only, so a dependency outage never
      # gets the pod restarted.
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

commerceflow:
  messaging:
    producer: payment-service
  payment:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    provider-uri: ${PAYMENT_PROVIDER_URI:http://localhost:8099}
    provider-api-key: ${SANDBOX_API_KEY:}
    provider-connect-timeout: 500ms
    # A charge that has not answered by now is UNKNOWN: it may or may not have happened.
    provider-read-timeout: 2s
    # When the reconciler first looks at an UNKNOWN attempt, and the base of its backoff: the
    # n-th look waits a random time between zero and reconcile-after * 2^n, at most
    # reconcile-backoff-max. It runs every reconcile-interval, up to reconcile-batch attempts.
    reconcile-after: 30s
    reconcile-backoff-max: 5m
    reconcile-interval: 10s
    reconcile-batch: 50
    # An attempt whose outcome is still unknown after this long, with no charge at the provider,
    # fails (PaymentFailed TIMEOUT_UNRESOLVED). NFR-04 bounds reconciliation by this window.
    reconcile-window: 15m
    # An INITIATED attempt older than this was left behind by a crash: no live charge call
    # (connect plus read timeout) takes anywhere near this long.
    reconcile-stale-initiated: 30s
    breaker-window: 10
    breaker-minimum-calls: 5
    breaker-failure-rate: 50
    breaker-open-for: 10s

logging:
  structured:
    json:
      # Secrets and personal data are masked in every JSON log line (INV-8; LogRedaction).
      customizer: dev.commerceflow.security.RedactingLogCustomizer
