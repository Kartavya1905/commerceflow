spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      server:
        webflux:
          # Only these routes exist. Anything else, including /internal/** and the services'
          # actuator endpoints, is unreachable from outside.
          default-filters:
            # Rejects bodies over 1 MB by Content-Length before they reach a service.
            - name: RequestSize
              args:
                maxSize: 1MB
          routes:
            - id: identity-auth
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                # Strict, per client IP: slows credential stuffing that spreads across accounts,
                # which per-account lockout alone cannot see.
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_RATE:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_BURST:10}
                    key-resolver: "#{@clientKeyResolver}"
            - id: identity
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**,/.well-known/jwks.json
              filters:
                - &general-rate-limit
                  name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE:50}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_BURST:100}
                    key-resolver: "#{@clientKeyResolver}"
            - id: catalog
              uri: ${CATALOG_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/admin/products/**
              filters:
                - *general-rate-limit
            - id: order
              uri: ${ORDER_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/cart,/api/v1/cart/**,/api/v1/orders,/api/v1/orders/**,/api/v1/admin/orders,/api/v1/admin/orders/**,/api/v1/admin/sagas,/api/v1/admin/sagas/**
              filters:
                - *general-rate-limit
            - id: inventory
              uri: ${INVENTORY_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/inventory/**,/api/v1/admin/inventory/**
              filters:
                - *general-rate-limit

server:
  port: ${PORT:8080}
  shutdown: graceful

# The gateway is the public entry point, so its own actuator lives on a separate port that is
# reachable only inside the network (Prometheus scrapes it there).
management:
  server:
    port: ${MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

commerceflow:
  gateway:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173}
