spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      server:
        webflux:
          # Only these routes exist. Anything else, including /internal/** and the services'
          # actuator endpoints, is unreachable from outside.
          default-filters:
            # Rejects bodies over 1 MB by Content-Length before they reach a service.
            - name: RequestSize
              args:
                maxSize: 1MB
          routes:
            - id: identity-auth
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                # Strict, per client IP: slows credential stuffing that spreads across accounts,
                # which per-account lockout alone cannot see.
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_RATE:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_BURST:10}
                    key-resolver: "#{@clientKeyResolver}"
            - id: identity
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**,/.well-known/jwks.json
              filters:
                - &general-rate-limit
                  name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE:50}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_BURST:100}
                    key-resolver: "#{@clientKeyResolver}"
            - id: catalog
              uri: ${CATALOG_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/admin/products/**
              filters:
                - *general-rate-limit
            - id: order
              uri: ${ORDER_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/cart,/api/v1/cart/**,/api/v1/orders,/api/v1/orders/**,/api/v1/admin/orders,/api/v1/admin/orders/**,/api/v1/admin/sagas,/api/v1/admin/sagas/**,/api/v1/admin/dlt/**
              filters:
                - *general-rate-limit
            - id: inventory
              uri: ${INVENTORY_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/inventory/**,/api/v1/admin/inventory/**
              filters:
                - *general-rate-limit
            # Admin views only: payments themselves are driven by Kafka, never by an HTTP call.
            - id: payment
              uri: ${PAYMENT_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/admin/payments,/api/v1/admin/payments/**
              filters:
                - *general-rate-limit

server:
  port: ${PORT:8080}
  shutdown: graceful

# The gateway is the public entry point, so its own actuator lives on a separate port that is
# reachable only inside the network (Prometheus scrapes it there).
management:
  # One trace per checkout across every service and Kafka (NFR-08). Every request is sampled: this
  # is a local, low-traffic system. Spans leave only when TRACING_EXPORT is on (dev-up --obs), so
  # without the collector nothing retries an export endpoint that is not there.
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: ${TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Logs stay on stdout (JSON, with trace and correlation ids); only traces go out over OTLP.
  logging:
    export:
      otlp:
        enabled: false
  # Metrics are scraped by Prometheus (/actuator/prometheus); the starter's OTLP push would only
  # retry a collector endpoint every minute and log a warning each time.
  otlp:
    metrics:
      export:
        enabled: false
  # Latency as a histogram with fixed buckets, so dashboards show percentiles (p95, p99), not
  # averages. Nine buckets per route instead of the default ~70 keeps the series count low, and
  # 300 ms (NFR-05, alert SlowReads) is one of the bucket edges, so it is measured exactly.
  metrics:
    distribution:
      slo:
        http.server.requests: 25ms,50ms,100ms,200ms,300ms,500ms,1s,2s,5s
  server:
    port: ${MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

commerceflow:
  gateway:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173}
    # Compose sets this to the web app (nginx), the only proxy whose X-Forwarded-For counts.
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

logging:
  structured:
    json:
      # Secrets and personal data are masked in every JSON log line (INV-8; LogRedaction).
      customizer: dev.commerceflow.security.RedactingLogCustomizer
