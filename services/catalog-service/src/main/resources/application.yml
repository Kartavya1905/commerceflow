spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${CATALOG_DB_USER:catalog_svc}
    password: ${CATALOG_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      # Milliseconds: Hikari binds this straight to a long.
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # The cache is an optimisation. If Redis is slow or down, give up quickly and read Postgres
      # instead of holding the request for Lettuce's 60-second default.
      timeout: 500ms
      connect-timeout: 500ms
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  # One trace per checkout across every service and Kafka (NFR-08). Every request is sampled: this
  # is a local, low-traffic system. Spans leave only when TRACING_EXPORT is on (dev-up --obs), so
  # without the collector nothing retries an export endpoint that is not there.
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: ${TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Logs stay on stdout (JSON, with trace and correlation ids); only traces go out over OTLP.
  logging:
    export:
      otlp:
        enabled: false
  # Metrics are scraped by Prometheus (/actuator/prometheus); the starter's OTLP push would only
  # retry a collector endpoint every minute and log a warning each time.
  otlp:
    metrics:
      export:
        enabled: false
  # Latency as a histogram with fixed buckets, so dashboards show percentiles (p95, p99), not
  # averages. Nine buckets per route instead of the default ~70 keeps the series count low, and
  # 300 ms (NFR-05, alert SlowReads) is one of the bucket edges, so it is measured exactly.
  metrics:
    distribution:
      slo:
        http.server.requests: 25ms,50ms,100ms,200ms,300ms,500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # A Redis outage degrades caching but must not mark the service unready.
    redis:
      enabled: false

commerceflow:
  catalog:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    product-cache-ttl: 60s
    page-cache-ttl: 30s

logging:
  structured:
    json:
      # Secrets and personal data are masked in every JSON log line (INV-8; LogRedaction).
      customizer: dev.commerceflow.security.RedactingLogCustomizer
