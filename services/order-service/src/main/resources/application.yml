spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:order_svc}
    password: ${ORDER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      # Milliseconds: Hikari binds this straight to a long.
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  jackson:
    deserialization:
      # A request with a field we do not define (say, a client-supplied price) is rejected
      # instead of silently ignored.
      fail-on-unknown-properties: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      # Offsets are committed only after the handler's transaction commits (ack-mode record).
      enable-auto-commit: false
      isolation-level: read-committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    listener:
      # Continues the trace from the traceparent each event carries (TraceHeaders).
      observation-enabled: true
      ack-mode: record
      concurrency: 3
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8083}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  # One trace per checkout across every service and Kafka (NFR-08). Every request is sampled: this
  # is a local, low-traffic system. Spans leave only when TRACING_EXPORT is on (dev-up --obs), so
  # without the collector nothing retries an export endpoint that is not there.
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: ${TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Logs stay on stdout (JSON, with trace and correlation ids); only traces go out over OTLP.
  logging:
    export:
      otlp:
        enabled: false
  # Metrics are scraped by Prometheus (/actuator/prometheus); the starter's OTLP push would only
  # retry a collector endpoint every minute and log a warning each time.
  otlp:
    metrics:
      export:
        enabled: false
  # Latency as a histogram with fixed buckets, so dashboards show percentiles (p95, p99), not
  # averages. Nine buckets per route instead of the default ~70 keeps the series count low, and
  # 300 ms (NFR-05, alert SlowReads) is one of the bucket edges, so it is measured exactly.
  metrics:
    distribution:
      slo:
        http.server.requests: 25ms,50ms,100ms,200ms,300ms,500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Readiness covers only what this pod needs to serve: its own database. Kafka is left out on
      # purpose, so a broker blip cannot take every pod out of service at once; the outbox holds
      # events until it is back. Liveness covers the process only, so a dependency outage never
      # gets the pod restarted.
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    # The cart is in Redis, but an outage there should fail cart calls, not mark the whole
    # service unready and stop order history from being served.
    redis:
      enabled: false

commerceflow:
  messaging:
    producer: order-service
  order:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    catalog-uri: ${CATALOG_URI:http://localhost:8082}
    catalog-connect-timeout: 500ms
    catalog-read-timeout: 1s
    cart-ttl: 7d
    cart-max-items: 50
    # Circuit breaker around the price lookup. Opens when at least half of the last 10 calls
    # failed (after 5 calls), then fails fast for 10 s before letting a trial call through.
    breaker-window: 10
    breaker-minimum-calls: 5
    breaker-failure-rate: 50
    breaker-open-for: 10s
    # How long the saga waits for each step's answer before the deadline sweeper re-sends its
    # command. Reconciling an unknown payment gets longer: payment-service resolves it well
    # within this (commerceflow.payment.reconcile-window), so this is only a backstop.
    saga-step-timeout: 2m
    saga-reconciliation-timeout: 30m
    # The sweeper looks for overdue sagas this often, takes up to this many per round, and
    # re-sends a step's command this many times, waiting a random time between zero and
    # base * 2^n (capped) between re-sends, before it compensates.
    saga-sweep-interval: 5s
    saga-sweep-batch: 100
    saga-max-resends: 5
    saga-resend-base: 10s
    saga-resend-max: 2m

logging:
  structured:
    json:
      # Secrets and personal data are masked in every JSON log line (INV-8; LogRedaction).
      customizer: dev.commerceflow.security.RedactingLogCustomizer
