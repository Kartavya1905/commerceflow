spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${INVENTORY_DB_USER:inventory_svc}
    password: ${INVENTORY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      # Milliseconds: Hikari binds this straight to a long.
      connection-timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      # Offsets are committed only after the handler's transaction commits (ack-mode record).
      enable-auto-commit: false
      isolation-level: read-committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    listener:
      ack-mode: record
      # One consumer thread per partition pair: 6 partitions on the checkout topics.
      concurrency: 3
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8084}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

commerceflow:
  messaging:
    producer: inventory-service
  inventory:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    # Long-stop for reservations the saga never resolves. Should never fire; alert if it does.
    reservation-long-stop: 24h
    expiry-batch-size: 100
